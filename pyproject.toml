[project]
name = "dealership-agent"
version = "0.1.0"
description = "Agentic AI customer service assistant for a used-car dealership"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.3.1",
    # Pinned <2: langchain-mcp-adapters 0.3.1 imports mcp.server.fastmcp,
    # which mcp 2.0 removed/restructured to mcp.server.mcpserver. Verified
    # 0.3.1 + mcp 1.29.0 (latest 1.x) import and run cleanly together -
    # see docs/adr/0003-mcp-real-stdio-transport.md.
    "mcp>=1.24.0,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.2",
    # Direct dependency (not just transitive via sentence-transformers)
    # specifically so the [tool.uv.sources] CPU-only override below
    # actually applies - uv only honors a source override for a package
    # listed as a direct project dependency.
    "torch>=2.0",
    "langfuse>=2.53,<3",
    "groq>=0.11",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.4",
    "httpx>=0.27",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "faker>=30.8",
    "pre-commit>=4.0",
    "types-python-jose>=3.3",
    "boto3-stubs[bedrock-runtime]>=1.35",
]
data = [
    "kaggle>=1.6",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Step 11, Part A: this project never runs on a GPU - the self-hosted
# embedding model (retrieval/embedder.py) is a small, cheap-to-run CPU
# workload by design, on both a dev laptop and an ECS Fargate task. The
# default PyPI torch wheel on Linux bundles the full CUDA/nvidia stack
# (cuBLAS, cuDNN, NCCL, etc.) regardless, which was measured at several
# GB of pure dead weight in the Docker image - directly working against
# "cost control is a first-class requirement" (larger images cost more
# to store in ECR and take longer to pull on every Fargate task start).
# Pinning torch to PyTorch's own CPU-only wheel index removes all of it.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/dealership_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() are meant to be called as argument defaults -
# this is the idiomatic pattern the framework itself documents, not a
# mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["dealership_agent", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "data/scripts"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kaggle.*", "pandas.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=dealership_agent --cov-report=term-missing"
markers = [
    "requires_live_credentials: needs real provider credentials (Groq API key, AWS Bedrock access) - excluded from default CI, run explicitly with -m requires_live_credentials",
]
